<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>サービス利用状況</title>
  <script>window.KAKEIBO_LIFF_ID = '';</script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="./shared/config.js"></script>
  <script src="./shared/auth.js"></script>
  <script src="./shared/data.js"></script>
  <style>
    :root {
      --bg: #FFFFFF; --panel: #FFFFFF; --ink: #16211C; --muted: #5B6B62; --faint: #8B978F;
      --border: #DCE4DE; --accent: #06C755; --accent-ink: #067A38; --accent-soft: #EAF0EB;
      --accent-soft2: #F2F7F4; --danger: #C0392B; --success-bg: #E4F7EC;
      --warn-bg: #FCEFE4; --warn-border: #E8C39E; --warn-ink: #A85C1C; --warn: #E8A15C;
      --crit-bg: #FCEAEA; --crit-border: #EEB4AE; --crit-ink: #B23227;
      --info-bg: #E8EEFB; --info-border: #B9CCF0; --info-ink: #2A4E9E; --info-ink2: #3A4E7A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14181A; --panel: #1C2220; --ink: #EAF0EB; --muted: #9AA6A0; --faint: #6C766F;
        --border: #2B332F; --accent: #06C755; --accent-ink: #4FE39A; --accent-soft: #1B2A22;
        --accent-soft2: #17231C; --danger: #E5766A; --success-bg: #163627;
        --warn-bg: #2E2114; --warn-border: #4A3420; --warn-ink: #E3A15C; --warn: #E3A15C;
        --crit-bg: #301715; --crit-border: #5C2A24; --crit-ink: #E5766A;
        --info-bg: #1A2436; --info-border: #2E4066; --info-ink: #7FA0E8; --info-ink2: #9DB4E8;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg); color: var(--ink);
      max-width: 560px; margin: 0 auto; padding: 20px 16px 60px;
      font-variant-numeric: tabular-nums;
    }
    a.backLink { font-size: 12px; color: var(--muted); text-decoration: none; }
    .pageHead { display: flex; justify-content: space-between; align-items: flex-start; margin: 10px 0 4px; }
    .pageHead h1 { font-size: 18px; font-weight: bold; margin: 0; }
    .pageHead .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .updated { font-size: 11px; color: var(--faint); margin: 10px 0 20px; }

    h2.sectionTtl {
      font-size: 12px; font-weight: bold; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.03em; margin: 26px 0 8px; display: flex; align-items: center; gap: 8px;
    }
    h2.sectionTtl:first-of-type { margin-top: 0; }
    .badge {
      font-size: 10px; font-weight: bold; letter-spacing: 0; text-transform: none;
      padding: 2px 8px; border-radius: 100px;
    }
    .badge.real { background: var(--info-bg); color: var(--info-ink); border: 1px solid var(--info-border); }
    .badge.estimate { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-border); }

    .frame { border: 1px solid var(--border); border-radius: 14px; padding: 6px 16px; background: var(--panel); }
    .note { font-size: 11px; color: var(--faint); line-height: 1.6; margin: -2px 0 14px; }

    .metric { padding: 14px 0; border-bottom: 1px solid var(--border); }
    .metric:last-child { border-bottom: none; }
    .metric .row1 { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .metric .label { font-size: 13px; font-weight: 600; }
    .metric .nums { font-size: 12px; color: var(--muted); }
    .metric .nums b { color: var(--ink); font-size: 13px; font-weight: bold; }
    .metric .nums b.warn { color: var(--warn-ink); }
    .metric .nums b.crit { color: var(--crit-ink); }
    .track { height: 7px; background: var(--accent-soft); border-radius: 100px; overflow: hidden; }
    .fill { height: 100%; background: var(--accent); border-radius: 100px; }
    .fill.warn { background: var(--warn); }
    .fill.crit { background: var(--danger); }
    .metric .pct { font-size: 10.5px; color: var(--faint); margin-top: 5px; text-align: right; }
    .metric .pct.warn { color: var(--warn-ink); font-weight: bold; }
    .metric .pct.crit { color: var(--crit-ink); font-weight: bold; }
    .metric.untracked .label { color: var(--faint); }
    .metric.untracked .nums { font-style: italic; }

    .footNote {
      margin-top: 30px; padding: 12px 14px; background: var(--accent-soft2); border: 1px solid var(--border);
      border-radius: 10px; font-size: 11.5px; color: var(--muted); line-height: 1.7;
    }
    .footNote b { color: var(--ink); }
    .empty { color: var(--faint); text-align: center; padding: 30px 0; font-size: 13px; }
  </style>
</head>
<body>
  <a class="backLink" href="./home.html">← ホームに戻る</a>

  <div class="pageHead">
    <div>
      <h1>サービス利用状況</h1>
      <div class="sub">Supabase・GAS・Gemini APIの制約枠に対する現在の利用量</div>
    </div>
  </div>
  <div class="updated" id="updatedAt"></div>

  <div id="content"><div class="empty">読み込み中...</div></div>

  <script>
    function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function fmtBytes(bytes) {
      const mb = bytes / (1024 * 1024);
      if (mb < 1024) return mb.toFixed(1) + ' MB';
      return (mb / 1024).toFixed(2) + ' GB';
    }
    function pctClass(pct) {
      if (pct >= 85) return 'crit';
      if (pct >= 60) return 'warn';
      return '';
    }
    function metricHtml(label, currentLabel, current, limit, unit) {
      const pct = limit > 0 ? Math.min(100, (current / limit) * 100) : 0;
      const cls = pctClass(pct);
      return '' +
        '<div class="metric">' +
          '<div class="row1">' +
            '<div class="label">' + esc(label) + '</div>' +
            '<div class="nums"><b class="' + cls + '">' + esc(currentLabel) + '</b> / ' + esc(String(limit)) + esc(unit || '') + '</div>' +
          '</div>' +
          '<div class="track"><div class="fill ' + cls + '" style="width:' + pct.toFixed(1) + '%"></div></div>' +
          '<div class="pct ' + cls + '">' + pct.toFixed(1) + '%' + (cls === 'crit' ? ' — 上限に近づいています' : cls === 'warn' ? ' — 注意' : '') + '</div>' +
        '</div>';
    }
    function untrackedMetricHtml(label) {
      return '' +
        '<div class="metric untracked">' +
          '<div class="row1">' +
            '<div class="label">' + esc(label) + '</div>' +
            '<div class="nums">計測未対応</div>' +
          '</div>' +
        '</div>';
    }

    (async () => {
      const el = document.getElementById('content');
      const ok = await window.kakeiboReady;
      if (!ok) { el.innerHTML = '<div class="empty">ログインに失敗しました。LINEアプリから開き直してください。</div>'; return; }
      try {
        const data = await window.kakeiboData.getUsageMonitoringData();
        document.getElementById('updatedAt').textContent = '最終更新: ' + new Date().toLocaleString('ja-JP');

        el.innerHTML =
          '<h2 class="sectionTtl">Supabase <span class="badge real">実測値</span></h2>' +
          '<div class="note">get_db_size_bytes() RPCでDBサイズを直接取得。無料枠の上限（500MB）はSupabase公式サイトに記載の目安で、変更されうる</div>' +
          '<div class="frame">' +
            metricHtml('DB容量', fmtBytes(data.dbSizeBytes), data.dbSizeBytes / (1024 * 1024), 500, ' MB') +
          '</div>' +

          '<h2 class="sectionTtl">Edge Functions <span class="badge estimate">推定値（LINE Webhookのみ）</span></h2>' +
          '<div class="note">line-webhook（LINEからの全メッセージ）の呼び出し回数を自己集計。shopping-classify・recipe-extractは未計測。無料枠の上限（50万回/月）はSupabase公式サイトに記載の目安</div>' +
          '<div class="frame">' +
            metricHtml('呼び出し回数（今月）', data.edgeFunctionInvocations.toLocaleString('ja-JP'), data.edgeFunctionInvocations, 500000, '') +
          '</div>' +

          '<h2 class="sectionTtl">Gemini API <span class="badge estimate">推定値</span></h2>' +
          '<div class="note">line-webhook・shopping-classify・recipe-extract全てのGemini呼び出しを自己集計。無料枠の上限は現在のモデル（gemini-flash-lite-latest）で確認が取れておらず、暫定的に1,500件/日として表示（要確認）</div>' +
          '<div class="frame">' +
            metricHtml('リクエスト数（今日）', data.geminiRequests.toLocaleString('ja-JP'), data.geminiRequests, 1500, '') +
          '</div>' +

          '<h2 class="sectionTtl">GAS <span class="badge estimate">未計測</span></h2>' +
          '<div class="note">GAS側（gas/GmailImport.gs等）のUrlFetch呼び出し・トリガー実行時間はまだ自己集計の仕組みを入れていない</div>' +
          '<div class="frame">' +
            untrackedMetricHtml('URL Fetch 呼び出し（今日）') +
            untrackedMetricHtml('トリガー合計実行時間（今日）') +
          '</div>' +

          '<div class="footNote">' +
            '<b>この画面について</b><br>' +
            '・「実測値」はSupabaseから直接取得した正確な数値です。<br>' +
            '・「推定値」はこのアプリ側で呼び出しのたびに記録したカウントを、各サービス公式サイト記載の目安の上限と比較したものです。実際の上限が変更された場合、コード側の上限値を手動で調整する必要があります（現時点では画面から編集できません）。<br>' +
            '・進捗バーは60%で黄色、85%で赤に変化します。' +
          '</div>';
      } catch (err) {
        el.innerHTML = '<div class="empty">読み込みエラー: ' + esc(err.message) + '</div>';
      }
    })();
  </script>
</body>
</html>
